# OpenReply — Coolify / production Docker Compose
#
# Database is Neon (managed Postgres) via DATABASE_URL, so there is NO postgres
# service here. Redis is the only local stateful service (BullMQ queue + rate
# limiter + worker heartbeat); it keeps a volume so the queue survives restarts.
#
# Migrations run at start (`prisma migrate deploy`) in the `web` service, not at
# build time — the build has no access to Neon and would fail with P1001.

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm start"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      META_GRAPH_API_VERSION: v25.0
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
      # ALLOWED_EMAILS: ${ALLOWED_EMAILS}   # uncomment to restrict sign-ins
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  worker:
    build: .
    restart: unless-stopped
    command: npm run worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy

  cron:
    build: .
    restart: unless-stopped
    command: sh scripts/cron.sh
    environment:
      CRON_BASE_URL: http://web:3000
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - web

volumes:
  redisdata:
